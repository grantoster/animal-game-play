<title>The Animal Game</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: one play board; Hoot the owl hosts every screen; chunky toy buttons; on iPad landscape the question/host sits left and the board stays pinned right. Single bright theme on purpose. */
:root{
  --bg:#e7f4ec; --card:#ffffff; --ink:#1b2a23; --muted:#56695f; --line:#cfe2d6;
  --leaf:#1e6a4a; --leaf-dark:#134a33; --leaf-soft:#d6efe1; --sun:#ffc63a; --sun-dark:#d99a12; --sun-soft:#fff2c9;
  --plum:#6a4b98; --plum-dark:#4a3270; --plum-soft:#ece6f6; --clay:#e46c35; --sky:#d6ecf7;
  --display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Avenir Next","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.45;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(circle at 92% -4%, var(--sun-soft) 0 180px, transparent 181px), var(--bg)}
#app{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.logo{font-family:var(--display);font-weight:800;font-size:26px;color:var(--leaf);background:none;border:0;padding:4px 0;cursor:pointer;letter-spacing:-.01em;min-height:44px}
.logo span{color:var(--plum)}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.pill{font:700 15px var(--body);border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:44px}
.pill[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf);color:#fff}
button:focus-visible,input:focus-visible{outline:3px solid var(--plum);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(32px,7vw,52px);font-weight:800}
h2{font-size:clamp(25px,5vw,34px);font-weight:800}
h3{font-size:20px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border-radius:24px;padding:20px;box-shadow:0 2px 0 var(--line);min-width:0}
.center{text-align:center}
/* Buttons */
.btn{font:800 20px var(--body);border:0;border-radius:18px;min-height:60px;padding:12px 18px;cursor:pointer;color:#fff;background:var(--leaf);box-shadow:0 6px 0 var(--leaf-dark);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-align:center}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--leaf-dark)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 6px 0 var(--sun-dark)}
.btn.sun:active{box-shadow:0 2px 0 var(--sun-dark)}
.btn.plum{background:var(--plum);box-shadow:0 6px 0 var(--plum-dark)}
.btn.plum:active{box-shadow:0 2px 0 var(--plum-dark)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.btn.small{font-size:16px;min-height:46px;padding:8px 14px;border-radius:14px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row > .btn{flex:1 1 150px}
.linkish{background:none;border:0;color:var(--leaf);font:800 16px var(--body);text-decoration:underline;cursor:pointer;padding:8px;min-height:44px}
/* Hoot */
.host{display:flex;align-items:center;gap:14px}
.owlwrap{flex:0 0 auto;width:104px}
.owl{width:100%;height:auto;display:block;animation:bob 3.2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.speech{position:relative;background:var(--sun-soft);border-radius:20px;padding:12px 16px;font:800 20px/1.25 var(--display);flex:1;min-width:0}
.speech::before{content:"";position:absolute;left:-10px;top:50%;margin-top:-10px;border:10px solid transparent;border-right-color:var(--sun-soft);border-left:0}
.speech small{display:block;font:700 15px/1.35 var(--body);color:var(--muted);margin-top:2px}
.host.big .owlwrap{width:140px}
@media (max-width:440px){.owlwrap{width:78px}.host.big .owlwrap{width:104px}.speech{font-size:18px}}
/* Home */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.mode{border:0;text-align:left;cursor:pointer;border-radius:24px;padding:18px 20px;display:flex;align-items:center;gap:16px;color:var(--ink);font:inherit;transition:transform .1s;min-height:96px}
.mode:active{transform:scale(.98)}
.mode .big{font-size:44px;line-height:1;flex:0 0 auto}
.mode h3{font-size:24px}
.mode span.d{display:block;font-size:15px;color:var(--ink);opacity:.8}
.mode.a{background:var(--sun);box-shadow:0 7px 0 var(--sun-dark)}
.mode.b{background:#bfe6cf;box-shadow:0 7px 0 #86c3a0}
.mode.d{background:#cfe6f5;box-shadow:0 7px 0 #93c2df}
.mode.c{background:#d9cdf0;box-shadow:0 7px 0 #ab97d6}
.status{display:inline-block;font:800 13px var(--body);letter-spacing:.06em;text-transform:uppercase;background:#fff;border-radius:999px;padding:2px 10px;margin-top:4px}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.shelf .btn{flex-direction:column;gap:2px;font-size:17px;min-height:84px;line-height:1.15}
.shelf .btn .ico{font-size:28px}
.shelf .btn small{font:700 13px var(--body);opacity:.8}
@media (max-width:440px){.shelf .btn{font-size:15px}}
.seg{display:flex;background:var(--card);border-radius:18px;padding:5px;gap:5px;border:2px solid var(--line)}
.seg button{flex:1;font:800 17px var(--body);border:0;border-radius:13px;min-height:48px;background:transparent;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--leaf);color:#fff}
.levelrow{display:flex;flex-direction:column;gap:6px}
.glabel{font:800 13px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
/* Counter */
.paws{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.paw{width:13px;height:13px;border-radius:50%;background:var(--line)}
.paw.on{background:var(--sun-dark)}
.counter{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:800}
.counter b{font-variant-numeric:tabular-nums}
/* Question (Hoot asks) */
.duo{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:820px){.duo{grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}}
.qcard{text-align:center;padding-block:26px}
.qnum{font:800 14px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.qtext{font-family:var(--display);font-weight:800;font-size:clamp(30px,6vw,44px);line-height:1.1;margin:10px auto 6px;max-width:20ch;text-wrap:balance}
.qhelp{color:var(--muted);max-width:44ch;margin:0 auto}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.answers .wide{grid-column:1 / -1}
.thinker{font-size:64px;line-height:1}
/* Reveal */
.medal{width:170px;height:170px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-size:96px;margin:6px auto 4px;box-shadow:0 8px 0 var(--sun-dark)}
@keyframes pop{0%{transform:scale(.3) rotate(-12deg)}70%{transform:scale(1.08) rotate(4deg)}100%{transform:scale(1)}}
.pop{animation:pop .5s ease-out}
.fact{background:var(--sky);border-radius:18px;padding:14px 18px;max-width:52ch;margin:4px auto 0;text-align:left}
.fact b{display:block;font:800 13px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--leaf);margin-bottom:2px}
@media (max-width:420px){.btn{font-size:18px}.medal{width:140px;height:140px;font-size:80px}}
/* Forms */
label{font-weight:800;display:block;margin-bottom:6px}
input[type=text],input[type=number]{width:100%;box-sizing:border-box;font:700 20px var(--body);padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.emojis{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;max-height:236px;overflow:auto;padding:2px}
.emo{font-size:30px;height:56px;border-radius:14px;border:2px solid var(--line);background:#fff;cursor:pointer}
.emo[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-soft)}
.yn{display:flex;gap:10px}
.yn button{flex:1;font:800 18px var(--body);min-height:52px;border-radius:14px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
.yn button[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-soft)}
/* You-guess */
.play{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:820px){
  .play{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
  .pinned{box-sizing:border-box;position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);max-height:calc(100vh - 20px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto}
}
.askbox{display:flex;gap:8px}
.askbox input{flex:1;min-width:0;font-size:18px;padding:12px 14px}
.askbox .btn{min-height:52px;padding:8px 14px;font-size:17px}
.mic{flex:0 0 auto;width:56px;border-radius:16px;border:2px solid var(--line);background:#fff;font-size:24px;cursor:pointer}
.mic.on{background:var(--plum);border-color:var(--plum);color:#fff}
.groups{display:flex;flex-direction:column;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.qgroup{border:2px solid var(--line);border-radius:16px;padding:4px 12px 10px}
.qgroup summary{display:flex;justify-content:space-between;gap:10px;font:800 15px var(--body);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;min-height:40px;align-items:center;list-style:none}
.qgroup summary::-webkit-details-marker{display:none}
.qgroup summary::before{content:"▸";margin-right:6px}.qgroup[open] summary::before{content:"▾"}
.qgroup summary span:first-child{flex:1}
.freelog{display:flex;flex-direction:column;gap:6px;margin-top:10px;font-weight:700}
.tagx{display:inline-block;min-width:38px;text-align:center;border-radius:8px;padding:1px 6px;font:800 13px var(--body);margin-right:6px}
.tagx.yes{background:var(--leaf-soft);color:var(--leaf-dark)}.tagx.no{background:var(--plum-soft);color:var(--plum-dark)}.tagx.idk{background:var(--sun-soft);color:var(--ink)}
.chip{font:700 16px var(--body);text-align:left;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:9px 12px;cursor:pointer;min-height:44px}
.chip:disabled{cursor:default}
.chip.locked{opacity:.5}
.chip.yes{background:var(--leaf-soft);border-color:var(--leaf);opacity:1}
.chip.no{background:var(--plum-soft);border-color:var(--plum);opacity:1}
.chip.idk{background:var(--sun-soft);border-color:var(--sun-dark);opacity:1}
.chip .tag{font-weight:800;margin-left:6px}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.tile{border:2px solid var(--line);background:#fff;border-radius:16px;padding:8px 4px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font:700 13px var(--body);color:var(--ink);min-height:80px;transition:opacity .2s}
.tile .e{font-size:32px;line-height:1.1}
.tile.out{opacity:.22}
.tile.wrong{opacity:.22;text-decoration:line-through}
.toggle{display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer;min-height:44px;margin:0}
.toggle input{width:24px;height:24px;accent-color:var(--leaf)}
.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.turnbar{background:var(--plum);color:#fff;border-radius:18px;padding:10px 16px;font:800 22px var(--display);text-align:center}
/* Scores */
.scores{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.score{background:var(--sun-soft);border-radius:18px;padding:14px;text-align:center}
.score .n{font:800 40px var(--display);font-variant-numeric:tabular-nums;line-height:1}
.score.turn{outline:3px solid var(--plum)}
/* Sticker book & badges */
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.sticker{border:2px solid var(--line);background:#fff;border-radius:18px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font:800 13px var(--body);color:var(--ink);cursor:pointer;min-height:96px}
.sticker .e{font-size:40px;line-height:1.1}
.sticker.got{background:var(--sun-soft);border-color:var(--sun-dark);transform:rotate(-1.5deg)}
.sticker.got:nth-child(even){transform:rotate(1.5deg)}
.sticker.locked .e{filter:brightness(0);opacity:.18}
.sticker.locked{color:var(--muted);cursor:default}
.progress{height:14px;background:var(--line);border-radius:999px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--leaf);border-radius:999px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border-radius:18px;padding:14px 10px;text-align:center;background:#fff;border:2px dashed var(--line)}
.badge .e{font-size:40px;line-height:1.1}
.badge.got{background:var(--sun-soft);border:2px solid var(--sun-dark)}
.badge.no .e{filter:grayscale(1);opacity:.35}
.badge b{display:block;font:800 16px var(--display)}
.badge small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.learned{display:flex;flex-direction:column;gap:8px}
.lrow{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:10px 14px;border:2px solid var(--line)}
.lrow .e{font-size:30px}
.lrow .nm{flex:1;min-width:0;font-weight:800}
/* How to play */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.step{background:var(--sun-soft);border-radius:20px;padding:16px;text-align:center}
.step .pic{font-size:54px;line-height:1.1}
.step .n{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--leaf);color:#fff;font:800 16px var(--body);margin-bottom:6px}
/* Toast & confetti */
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(140%);background:var(--ink);color:#fff;font:800 18px var(--body);padding:14px 20px;border-radius:18px;z-index:60;transition:transform .35s,visibility .35s;visibility:hidden;max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);visibility:visible}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){.owl,.pop{animation:none}.btn,.mode,.toast{transition:none}}
</style>

<div id="app">
  <header class="top">
    <button class="logo" id="homeBtn" type="button">The Animal <span>Game</span></button>
    <div class="toggles">
      <button class="pill" id="soundBtn" type="button" aria-pressed="true">🔔 Sounds</button>
      <button class="pill" id="voiceBtn" type="button" aria-pressed="false">🗣️ Read aloud</button>
    </div>
  </header>
  <main id="screen"></main>
  <div id="live" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
'use strict';
// ================= Questions =================
// [code, question, group, help]
const BASEQ = [
 ['ma','Is it a mammal?','What kind'],['bi','Is it a bird?','What kind'],['re','Is it a reptile?','What kind','Dinosaurs count as reptiles here.'],
 ['fi','Is it a fish?','What kind','Sharks, rays and seahorses are fish. Whales and dolphins are not.'],['am','Is it an amphibian?','What kind'],
 ['in','Is it an insect?','What kind','Six legs. Spiders and crabs are not insects.'],
 ['ar','Is it an arachnid?','What kind','Spiders, scorpions and their relatives.'],
 ['cr','Is it a crustacean?','What kind','Crabs, shrimp, lobsters and their relatives.'],['mo','Is it a mollusk?','What kind','Octopuses, squid, snails, clams.'],
 ['iv','Is it an invertebrate?','What kind','No backbone.'],['mr','Is it a marsupial?','What kind','Mammals whose babies grow in a pouch or on the belly.'],
 ['pr','Is it a primate?','What kind'],['ro','Is it a rodent?','What kind'],
 ['fel','Is it in the cat family?','What kind'],['can','Is it in the dog family?','What kind'],
 ['wb','Is it warm-blooded?','What kind'],
 ['ex','Is it extinct?','What kind'],
 ['fu','Does it have fur?','Its body'],['lf','Does it have long or shaggy fur?','Its body'],['fe','Does it have feathers?','Its body'],['sc','Does it have scales?','Its body'],
 ['sh','Does it have a shell?','Its body'],['bg','Is it bigger than a grown-up?','Its body','Heavier than about 150 pounds or longer than about 6 feet.'],
 ['sm','Is it smaller than a house cat?','Its body'],['l4','Does it walk on four legs?','Its body'],['2l','Does it walk on two legs?','Its body'],
 ['6l','Does it have six legs?','Its body'],['8l','Does it have eight legs?','Its body'],['nl','Does it have no legs at all?','Its body'],
 ['ln','Does it have a long neck?','Its body'],['tl','Does it have a tail?','Its body'],['wg','Does it have wings?','Its body','Even wings it can\'t fly with.'],
 ['fn','Does it have fins or flippers?','Its body'],['tn','Does it have tentacles or arms with suckers?','Its body'],['ho','Does it have horns or antlers?','Its body'],
 ['tk','Does it have tusks?','Its body'],['tr','Does it have a trunk?','Its body'],['mn','Does it have a mane?','Its body'],['hm','Does it have a hump?','Its body'],
 ['po','Does it have a pouch?','Its body'],['bk','Does it have a beak or bill?','Its body'],['cw','Does it have claws or talons?','Its body'],
 ['hf','Does it have hooves?','Its body'],['wh','Does it have whiskers?','Its body'],['spk','Does it have spikes, spines or quills?','Its body'],
 ['le','Does it have big or long ears?','Its body'],['st','Does it have stripes?','Its body'],['sp','Does it have spots?','Its body'],
 ['bw','Is it black and white?','Its body'],
 ['cbr','Is it brown?','Colors'],['cgy','Is it gray?','Colors'],['cwt','Is it white?','Colors'],['cbk','Is it black?','Colors'],['cor','Is it orange?','Colors'],
 ['cye','Is it yellow or golden?','Colors'],['cgr','Is it green?','Colors'],['cpk','Is it pink?','Colors'],['crd','Is it red?','Colors'],['cbl','Is it blue?','Colors'],['cpu','Is it purple?','Colors'],
 ['wa','Does it live in or near water?','Where it lives'],['oc','Does it live in the ocean?','Where it lives'],['dp','Does it live in the deep sea?','Where it lives'],
 ['fw','Does it live in fresh water?','Where it lives','Rivers, lakes, ponds, swamps.'],['af','Does it live in Africa?','Where it lives'],['as','Does it live in Asia?','Where it lives'],
 ['eu','Does it live in Europe?','Where it lives'],
 ['na','Does it live in North America?','Where it lives'],['sa','Does it live in South America?','Where it lives'],
 ['au','Does it live in Australia or Oceania?','Where it lives'],['an','Does it live in Antarctica or the Southern Ocean?','Where it lives'],['ac','Does it live in the Arctic?','Where it lives'],
 ['co','Does it live where it gets cold and snowy?','Where it lives'],['jg','Does it live in a forest or jungle?','Where it lives'],['rf','Does it live in a rainforest?','Where it lives'],
 ['ds','Does it live in the desert?','Where it lives'],['sv','Does it live in a savanna or grassland?','Where it lives'],['mt','Does it live in the mountains?','Where it lives'],
 ['ug','Does it live underground or in burrows?','Where it lives'],['is','Does it live only on islands?','Where it lives'],['pe','Is it commonly kept as a pet?','Where it lives'],['fa','Does it live on farms?','Where it lives'],
 ['me','Does it eat meat?','What it does','Including insects, fish or other animals.'],['pl','Does it eat plants?','What it does','Including fruit, seeds or nectar.'],
 ['ap','Is it an apex predator?','What it does','At the top of its food chain.'],['fl','Can it fly?','What it does'],['gli','Can it glide?','What it does'],
 ['sw','Can it swim well?','What it does'],['fs','Is it really fast?','What it does'],['ni','Is it nocturnal?','What it does','Awake mostly at night.'],
 ['cl','Can it climb trees?','What it does'],['ju','Does it hop or jump a lot?','What it does'],['eg','Does it lay eggs?','What it does'],
 ['vn','Is it venomous, or can it sting?','What it does'],['po2','Is it poisonous to eat or touch?','What it does'],['el','Can it make electricity?','What it does'],
 ['gl','Can it glow?','What it does','Bioluminescence.'],['ec','Does it use echolocation?','What it does'],['cm','Does it use camouflage?','What it does'],
 ['cc','Can it change color?','What it does'],['mi','Does it mimic or fake something else?','What it does'],['rg','Can it regrow body parts?','What it does'],
 ['mg','Does it migrate?','What it does'],['hb','Does it hibernate?','What it does'],['gp','Does it live in a group?','What it does','Herd, pack, flock, pod, colony or school.'],
 ['jb','Do people use it for work?','What it does'],['ue','Can it live over 50 years?','What it does'],['end','Is it endangered?','What it does','Endangered or critically endangered.']
];
const BASECODES = BASEQ.map(q=>q[0]);
const COLOR = new Set(BASEQ.filter(q=>q[2]==='Colors').map(q=>q[0]));
const GROUPS = ['What kind','Its body','Colors','Where it lives','What it does','Our questions'];
const RAW_ALL = `__ANIMALS__`;
const BUILTIN = RAW_ALL.trim().split('\n').map(line=>{
  const [name,emoji,tier,codes,fact]=line.split('|');
  const yes=new Set(codes.trim().split(/\s+/));

}

let A=null;
function startA(){
  MAXQ=30;
  A={asked:[],answers:{},rejected:new Set(),guesses:0,hist:[]};
  screen.innerHTML=`<div class="duo">
    <div class="card">${host('wow',"Think of an animal. Don't tell me!",'Keep it secret in your head. I\'ll try to guess it.',true)}</div>
    <div class="card qcard stack"><div class="thinker" aria-hidden="true">🤫</div><h2>Got one in your head?</h2>
      <div class="row"><button class="btn sun" id="ready" type="button">I'm ready!</button></div></div>
  </div>`;
  $('#ready').onclick=()=>{ sfx('tap'); stepA(); };
  say("Think of an animal. Don't tell me! Tap I'm ready when you have one.");
}
function snapA(view){ A.hist.push({asked:[...A.asked],answers:{...A.answers},rejected:[...A.rejected],guesses:A.guesses,view}); }
function undoA(){
  const s=A.hist.pop(); if(!s) return;
  A.asked=s.asked; A.answers=s.answers; A.rejected=new Set(s.rejected); A.guesses=s.guesses;
  navToken++; sfx('tap');
  if(s.view.type==='ask') askA(s.view.c); else showGuessA(s.view.name);
}
function mismatch(a){ let m=0; for(const c of A.asked){ const v=A.answers[c]; if(v===undefined) continue; const av=a.attrs[c]; if(av!==undefined&&av!==v) m++; } return m; }
function poolA(){
  const alive=ANIMALS.filter(a=>!A.rejected.has(a.name)); if(!alive.length) return [];
  const sc=alive.map(a=>({a,m:mismatch(a)})); const min=Math.min(...sc.map(s=>s.m));
  return sc.filter(s=>s.m===min).map(s=>s.a);
}
function bestQuestion(pool){
  let best=null,val=0;
  for(const q of shuffle(allQ())){ const c=q[0]; if(A.asked.includes(c)||COLOR.has(c)) continue;
    let y=0,n=0; pool.forEach(a=>{ if(a.attrs[c]===true) y++; else if(a.attrs[c]===false) n++; });
    if(!BASECODES.includes(c)&&(y+n)>0) n=pool.length-y; // taught question: unknown animals probably say no
    const v=Math.min(y,n); if(v>val){val=v;best=c;} }
  return best;
}
function hootChat(n,first){
  if(first) return ['happy','Here we go!'];
  if(n>15) return ['idle',pick(['Hmm, let\'s see…','So many animals it could be!'])];
  if(n>5) return ['think',pick(['I\'m narrowing it down…','Getting warmer…'])];
  if(n>1) return ['smug',`Ooh, I've got ${n} animals in mind…`];
  return ['smug','I think I know!'];
}
function stepA(){
  const pool=poolA();
  if(!pool.length||A.guesses>=3) return learnA();
  if(A.asked.length>=MAXQ||pool.length===1) return guessA(pool);
  const c=bestQuestion(pool); if(!c) return guessA(pool);
  askA(c);
}
function askA(c){
  const q=QMAP()[c]; const n=A.asked.length+1; const pool=poolA();
  const [mood,chat]=hootChat(pool.length,A.asked.length===0);
  screen.innerHTML=`<div class="duo">
    <div class="card stack">${host(mood,esc(chat))}${counter(A.asked.length)}</div>
    <div class="card qcard">
      <div class="qnum">Question ${n}</div>
      <div class="qtext">${esc(q[1])}</div>
      ${q[3]?`<p class="qhelp">${esc(q[3])}</p>`:''}
      <div class="answers">
        <button class="btn" id="aY" type="button">👍 Yes</button>
        <button class="btn plum" id="aN" type="button">👎 No</button>
        <button class="btn ghost wide" id="aU" type="button">🤷 Not sure</button>
      </div>
      <div class="row" style="margin-top:18px">
        <button class="btn ghost small" id="undo" type="button" ${A.hist.length?'':'disabled'}>↩️ Undo</button>
        <button class="btn ghost small" id="quitA" type="button">Stop game</button>
      </div>
    </div></div>`;
  const ans=(v,s)=>{ sfx(s); snapA({type:'ask',c}); A.asked.push(c); if(v!==null) A.answers[c]=v; stepA(); };
  $('#aY').onclick=()=>ans(true,'yes'); $('#aN').onclick=()=>ans(false,'no'); $('#aU').onclick=()=>ans(null,'idk');
  $('#undo').onclick=undoA; $('#quitA').onclick=()=>go(home);
  say((A.asked.length%3===2?chat+' ':'')+q[1]);
}
function guessA(pool){
  const g=pick(pool);
  const tok=++navToken;
  screen.innerHTML=`<div class="duo">
    <div class="card stack">${host('think','Hmm… let me think…')}${counter(Math.min(A.asked.length,MAXQ))}</div>
    <div class="card qcard"><div class="thinker" aria-hidden="true">🥁</div><h2>Drumroll, please…</h2></div></div>`;
  sfx('drum'); say('Drumroll please!');
  setTimeout(()=>{ if(tok===navToken) showGuessA(g.name,true); }, reduced()?400:1500);
}
function showGuessA(name,fresh){
  const g=ANIMALS.find(a=>a.name===name);
  if(fresh) A.guesses++;
  screen.innerHTML=`<div class="duo">
    <div class="card stack">${host('wow',`Is it ${an(g.name)} ${esc(g.name)}?`)}${counter(Math.min(A.asked.length,MAXQ))}</div>
    <div class="card qcard">
      <div class="qnum">My guess${A.guesses>1?' #'+A.guesses:''}</div>
      <div class="medal pop" aria-hidden="true">${esc(g.emoji)}</div>
      <div class="qtext">Is it ${an(g.name)} ${esc(g.name)}?</div>
      <div class="answers"><button class="btn" id="gY" type="button">🎉 Yes!</button><button class="btn plum" id="gN" type="button">Nope</button></div>
      <div class="row" style="margin-top:18px"><button class="btn ghost small" id="undo" type="button" ${A.hist.length?'':'disabled'}>↩️ Undo</button></div>
    </div></div>`;
  $('#gY').onclick=()=>{
    // Remember answers to the kids' own questions for this animal.
    const custom={}; store.customQ.forEach(q=>{ if(A.answers[q.code]!==undefined) custom[q.code]=A.answers[q.code]; });
    if(Object.keys(custom).length){ upsertLearned(g.name,{attrs:custom}); }
    save(); rebuild(); unlock(g.name);
    sfx('win'); confetti();
    reveal({title:'I got it! Hoo hoo!',mood:'happy',animal:g,
      lines:`<p class="muted">I needed ${A.asked.length} question${A.asked.length===1?'':'s'} and ${A.guesses} guess${A.guesses===1?'':'es'}.</p>`,
      buttons:`<button class="btn sun" id="again" type="button">Play again</button><button class="btn ghost" id="hm" type="button">Home</button>`});
    $('#again').onclick=()=>go(startA); $('#hm').onclick=()=>go(home);
    say(`Yes! I guessed it! It's ${an(g.name)} ${g.name}.`+(g.fact?` Creature power: ${g.fact}`:''));
  };
  $('#gN').onclick=()=>{ sfx('no'); snapA({type:'guess',name:g.name}); A.rejected.add(g.name); stepA(); };
  $('#undo').onclick=undoA;
  if(fresh) say(`Is it ${an(g.name)} ${g.name}?`);
}
function commitStump(){ store.stats.stumps++; save(); award('stump1'); if(store.stats.stumps>=5) award('stump5'); }
function learnA(){
  sfx('lose');

  const winner=race?race.names[race.turn]:null;
  let pts=0;
  if(tp){ pts=won?Math.max(1,MAXQ+1-B.used):0; tp.scores[tp.turn]+=pts; tp.rounds[tp.turn]++; }
  if(won){
    unlock(s.name);
    if(!o.stump){ award('firstfind'); if(B.used<=8) award('sleuth8'); if(B.used<=5) award('sleuth5'); }
    if(!o.stump&&B.wasted===0&&Object.keys(B.asked).length>=2) award('nowaste');
    if(B.level==='hard'&&!o.daily) award('hard');
    if(race) award('race');
    sfx('win'); confetti();
  } else sfx('lose');
  if(o.daily){
    const k=dayKey();
    store.stats.dailyDone[k]={won,tries:B.used};
    if(won){ store.stats.dailyStreak=store.stats.lastDaily===yesterdayKey()?store.stats.dailyStreak+1:1; store.stats.lastDaily=k; award('daily1'); if(store.stats.dailyStreak>=3) award('streak3'); }
    const keys=Object.keys(store.stats.dailyDone).sort(); while(keys.length>40) delete store.stats.dailyDone[keys.shift()];
    save();
  }
  let title,lines;
  if(race){ title=won?`${winner} wins the race!`:'Nobody found it this time!'; lines=`<p class="muted">${won?`Found in ${B.used} tries total.`:`It was ${an(s.name)} ${esc(s.name)}.`}</p>`; }
  else if(o.stump){ title=won?`${o.stump.guesser} found it!`:`${o.stump.picker} stumped ${o.stump.guesser}!`; lines=`<p class="muted">${won?`${esc(o.stump.guesser)} used ${B.used} of ${MAXQ} tries.`:`The secret animal was ${an(s.name)} ${esc(s.name)}.`}</p>`; }
  else { title=won?'You found it!':gaveUp?'Here was my animal':'Out of tries!';
    lines=won?`<p class="muted">You used ${B.used} of ${MAXQ} tries.${tp?` That's <b>${pts}</b> point${pts===1?'':'s'} for ${esc(tp.names[tp.turn])}.`:''}${o.daily?` Daily streak: <b>${store.stats.dailyStreak}</b>.`:''}</p>`
            :`<p class="muted">I was thinking of ${an(s.name)} ${esc(s.name)}.${tp?' No points this turn.':''}</p>`; }
  let buttons;
  if(tp) buttons=`<button class="btn sun" id="next" type="button">Next turn: ${esc(tp.names[1-tp.turn])}</button>${tp.rounds[0]===tp.rounds[1]?'<button class="btn ghost" id="end" type="button">See who won</button>':''}`;
  else if(race) buttons=`<button class="btn sun" id="again" type="button">Race again</button><button class="btn ghost" id="hm" type="button">Home</button>`;
  else if(o.stump) buttons=`<button class="btn sun" id="again" type="button">Switch: ${esc(o.stump.guesser)} picks</button><button class="btn ghost" id="hm" type="button">Home</button>`;
  else if(o.daily) buttons=`<button class="btn sun" id="hm" type="button">Home</button>`;
  else buttons=`<button class="btn sun" id="again" type="button">Play again</button><button class="btn ghost" id="hm" type="button">Home</button>`;
  reveal({title,mood:won?'happy':'smug',animal:s,lines:(tp?scoreBoard(tp,-1):'')+lines,buttons});
  const q=id=>document.getElementById(id);
  if(tp){ q('next').onclick=()=>{tp.turn=1-tp.turn; go(()=>passScreen(tp));}; if(q('end')) q('end').onclick=()=>go(()=>final2P(tp)); }
  else if(race){ q('again').onclick=()=>go(()=>startRace(race.names)); q('hm').onclick=()=>go(home); }
  else if(o.stump){ q('again').onclick=()=>go(()=>stumpPick({picker:o.stump.guesser,guesser:o.stump.picker})); q('hm').onclick=()=>go(home); }
  else { if(q('again')) q('again').onclick=()=>go(()=>startB({})); q('hm').onclick=()=>go(home); }
  say(`${won?(race?winner+' wins! ':'You got it! '):''}It was ${an(s.name)} ${s.name}.`+(s.fact?` Creature power: ${s.fact}`:''));
}

// ================= Two players =================
function names(){ return [ (store.p1||'').trim()||'Player 1', (store.p2||'').trim()||'Player 2' ]; }
function twoMenu(){
  screen.innerHTML=`<div class="card stack">
    ${host('happy',"Who's playing?",'Type your names, then pick a game.')}
    <div class="row" style="gap:12px">
      <div style="flex:1 1 200px"><label for="p1">Player 1</label><input type="text" id="p1" maxlength="20" autocomplete="off" value="${esc(store.p1||'')}" placeholder="Name"></div>
      <div style="flex:1 1 200px"><label for="p2">Player 2</label><input type="text" id="p2" maxlength="20" autocomplete="off" value="${esc(store.p2||'')}" placeholder="Name"></div>
    </div>
    <div class="modes">
      <button class="mode a" id="tTurns" type="button"><span class="big" aria-hidden="true">🔁</span><span><h3>Take turns</h3><span class="d">Each finds their own secret animal. Fewer tries scores more points.</span></span></button>
      <button class="mode b" id="tRace" type="button"><span class="big" aria-hidden="true">🏁</span><span><h3>Race</h3><span class="d">Same secret animal. Take turns asking. First to guess it wins.</span></span></button>
      <button class="mode c" id="tStump" type="button"><span class="big" aria-hidden="true">🙈</span><span><h3>Stump your sibling</h3><span class="d">One picks a secret animal. The other asks. Hoot answers.</span></span></button>
    </div>
  </div>`;
  const keep=()=>{ store.p1=$('#p1').value.trim().slice(0,20); store.p2=$('#p2').value.trim().slice(0,20); save(); return names(); };
  $('#tTurns').onclick=()=>{ const n=keep(); go(()=>passScreen({names:n,scores:[0,0],rounds:[0,0],turn:0})); };
  $('#tRace').onclick=()=>{ const n=keep(); go(()=>startRace(n)); };
  $('#tStump').onclick=()=>{ const n=keep(); go(()=>stumpPick({picker:n[0],guesser:n[1]})); };
}
function startRace(n){ startB({race:{names:n,turn:Math.random()<.5?0:1}}); }
function scoreBoard(tp,hl){
  const t=hl===undefined?tp.turn:hl;
  return `<div class="scores">${[0,1].map(i=>`<div class="score${i===t?' turn':''}"><div style="font-weight:800">${esc(tp.names[i])}</div><div class="n">${tp.scores[i]}</div><div class="muted" style="font-size:14px">${tp.rounds[i]} turn${tp.rounds[i]===1?'':'s'}</div></div>`).join('')}</div>`;
}
function passScreen(tp){
  screen.innerHTML=`<div class="card qcard stack">
    ${scoreBoard(tp)}
    ${host('wow',`Pass the iPad to ${esc(tp.names[tp.turn])}!`,`No peeking, ${esc(tp.names[1-tp.turn])}!`)}
    <div class="row"><button class="btn sun" id="rdy" type="button">I'm ${esc(tp.names[tp.turn])} and I'm ready</button></div>
    ${tp.rounds[0]===tp.rounds[1]&&tp.rounds[0]>0?'<div class="row"><button class="btn ghost small" id="end" type="button">End game</button></div>':''}
  </div>`;
  $('#rdy').onclick=()=>go(()=>startB({tp})); const e=$('#end'); if(e) e.onclick=()=>go(()=>final2P(tp));
  say(`Pass the iPad to ${tp.names[tp.turn]}.`);
}
function final2P(tp){
  const [a,b]=tp.scores; const msg=a===b?"It's a tie!":`${tp.names[a>b?0:1]} wins!`;
  sfx('win'); confetti();
  screen.innerHTML=`<div class="card qcard stack">
    ${host('happy',esc(msg))}
    <div class="medal pop" aria-hidden="true">🏆</div>
    ${scoreBoard(tp,a===b?-1:(a>b?0:1))}
    <div class="row"><button class="btn sun" id="again" type="button">New game</button><button class="btn ghost" id="hm" type="button">Home</button></div>
  </div>`;
  $('#again').onclick=()=>go(twoMenu); $('#hm').onclick=()=>go(home);
  say(msg);
}
function stumpPick(roles){
  const list=[...levelAnimals()].sort((a,b)=>a.name.localeCompare(b.name));
  screen.innerHTML=`<div class="card stack">
    ${host('smug',`${esc(roles.picker)}, pick a secret animal!`,`Don't let ${esc(roles.guesser)} see.`)}
    <input type="text" id="pickFilter" autocomplete="off" placeholder="Find a species" aria-label="Find a species" style="font-size:17px;padding:10px 14px">
    <div class="board" id="pickBoard">${list.map(a=>`<button type="button" class="tile" data-n="${esc(a.name)}"><span class="e" aria-hidden="true">${esc(a.emoji)}</span>${esc(a.name)}</button>`).join('')}</div>
    <div class="row"><button class="btn ghost small" id="hm" type="button">Cancel</button></div>
  </div>`;
  $('#hm').onclick=()=>go(home);
  $('#pickFilter').oninput=e=>{ const f=e.target.value.trim().toLowerCase(); document.querySelectorAll('#pickBoard .tile').forEach(t=>{ t.hidden=!!f&&!t.dataset.n.includes(f); }); };
  $('#pickBoard').onclick=e=>{ const b=e.target.closest('.tile'); if(!b) return; const a=ANIMALS.find(x=>x.name===b.dataset.n); sfx('tap');
    go(()=>{ screen.innerHTML=`<div class="card qcard stack">
      ${host('wow',`Shh! You picked ${an(a.name)} ${esc(a.name)}.`,`Now pass the iPad to ${esc(roles.guesser)}.`)}
      <div class="row"><button class="btn sun" id="rdy" type="button">I'm ${esc(roles.guesser)} and I'm ready</button><button class="btn ghost" id="back" type="button">Pick again</button></div></div>`;
      $('#rdy').onclick=()=>go(()=>startB({secret:a,stump:roles})); $('#back').onclick=()=>go(()=>stumpPick(roles)); }); };
  say(`${roles.picker}, pick a secret animal. Don't let ${roles.guesser} see!`);
}

// ================= Sticker book & badges =================
function stickerBook(){
  const list=[...ANIMALS].sort((a,b)=>(a.tier==='h')-(b.tier==='h')||a.name.localeCompare(b.name));
  const got=list.filter(a=>store.found[a.name]).length;
  screen.innerHTML=`<div class="card stack">
    ${host('happy','Your sticker book!','Find an animal, or show me yours, to earn its sticker.')}
    <div><div class="counter"><span>Stickers: <b>${got}</b> of ${list.length}</span></div><div class="progress" style="margin-top:6px"><span style="width:${list.length?Math.round(got/list.length*100):0}%"></span></div></div>
    <div id="stickerInfo" hidden></div>
    <div class="book" id="book">${list.map(a=>{ const g=!!store.found[a.name];
      return `<button type="button" class="sticker ${g?'got':'locked'}" data-n="${esc(a.name)}" ${g?'':'disabled'} aria-label="${g?esc(a.name):'Locked sticker'}"><span class="e" aria-hidden="true">${esc(a.emoji)}</span>${g?esc(a.name):'?'}</button>`; }).join('')}</div>
    <div class="row"><button class="btn sun" id="hm" type="button">Back home</button></div>
  </div>`;
  $('#hm').onclick=()=>go(home);
  $('#book').onclick=e=>{ const b=e.target.closest('.sticker.got'); if(!b) return; const a=ANIMALS.find(x=>x.name===b.dataset.n); sfx('tap');
    const box=$('#stickerInfo'); box.hidden=false;
    box.innerHTML=`<div class="fact" style="margin:0;max-width:none"><b>${esc(a.emoji+' '+cap(a.name))}</b>${esc(a.fact||'No creature power recorded yet.')}</div>`;
    try{ box.scrollIntoView({behavior:reduced()?'auto':'smooth',block:'center'}); }catch(err){}
    say(cap(a.name)+'. '+(a.fact||'')); };
}
function badgePage(){
  const n=BADGES.filter(b=>store.badges[b[0]]).length;
  screen.innerHTML=`<div class="card stack">
    ${host(n?'happy':'idle',`You have ${n} of ${BADGES.length} badges!`,'Keep playing to earn more.')}
    <div class="badges">${BADGES.map(b=>{ const g=store.badges[b[0]];
      return `<div class="badge ${g?'got':'no'}"><div class="e" aria-hidden="true">${b[1]}</div><b>${esc(b[2])}</b><small>${esc(b[3])}</small></div>`; }).join('')}</div>
    <div class="row"><button class="btn sun" id="hm" type="button">Back home</button></div>
  </div>`;
  $('#hm').onclick=()=>go(home);
}

// ================= Learned list =================
function learnedList(){
  const rows=store.learned.map((l,i)=>{ const a=ANIMALS.find(x=>x.name===l.name);
    return `<div class="lrow"><span class="e" aria-hidden="true">${esc(a?a.emoji:'🐾')}</span><span class="nm">${esc(cap(l.name))}${BUILTIN_NAMES.has(l.name)?' <span class="muted" style="font-weight:700">(updated)</span>':''}</span><button type="button" class="btn ghost small" data-i="${i}" data-k="a">Forget</button></div>`; }).join('');
  const qrows=store.customQ.map((q,i)=>`<div class="lrow"><span class="e" aria-hidden="true">❓</span><span class="nm">${esc(q.text)}</span><button type="button" class="btn ghost small" data-i="${i}" data-k="q">Forget</button></div>`).join('');
  screen.innerHTML=`<div class="card stack">
    ${host('happy','Things you taught me','They\'re saved on this device.')}
    <h3>Animals</h3>
    ${rows?`<div class="learned" id="ll">${rows}</div>`:'<p class="muted">Nothing yet. Stump me in "You think, I guess" and teach me one.</p>'}
    <h3>Questions</h3>
    ${qrows?`<div class="learned" id="lq">${qrows}</div>`:'<p class="muted">No new questions yet. You can teach me one when you stump me.</p>'}
    <div class="row"><button class="btn sun" id="hm" type="button">Back home</button></div>
  </div>`;
  $('#hm').onclick=()=>go(home);
  const handler=e=>{ const b=e.target.closest('button[data-i]'); if(!b) return;
    if(!b.dataset.sure){ b.dataset.sure='1'; b.textContent='Tap again to forget'; return; }
    const i=+b.dataset.i;
    if(b.dataset.k==='a') store.learned.splice(i,1);
    else { const code=store.customQ[i].code; store.customQ.splice(i,1); store.learned.forEach(l=>delete l.attrs[code]); }
    save(); rebuild(); learnedList(); };
  [$('#ll'),$('#lq')].forEach(el=>{ if(el) el.onclick=handler; });
}

// ================= Grown-ups =================
function grownGate(){
  const x=6+Math.floor(Math.random()*4), y=6+Math.floor(Math.random()*4);
  screen.innerHTML=`<div class="card stack">
    ${host('idle','Grown-ups only!','Answer to open settings.')}
    <form id="gate" class="stack"><div><label for="gateIn">What is ${x} × ${y}?</label><input type="number" id="gateIn" inputmode="numeric" autocomplete="off"></div>
    <p id="gmsg" class="muted" hidden>That's not it. Try again.</p>
    <div class="row"><button class="btn sun" type="submit">Open</button><button class="btn ghost" id="hm" type="button">Back</button></div></form>
  </div>`;
  $('#hm').onclick=()=>go(home);
  $('#gate').onsubmit=e=>{ e.preventDefault(); if(+$('#gateIn').value===x*y) go(grownUps); else $('#gmsg').hidden=false; };
}
function grownUps(){
  const canFiles=/github\.io$|^localhost$|^127\./.test(location.hostname);
  screen.innerHTML=`<div class="card stack">
    <h2>Grown-up settings</h2>
    <p>Progress saves on this device by itself, in two places. Open the game from its Home Screen icon so it always finds its saves.</p>
    <p class="muted">Stickers: ${Object.keys(store.found).length} · Badges: ${Object.keys(store.badges).length} · Learned animals: ${store.learned.length} · Learned questions: ${store.customQ.length}</p>
    ${canFiles?`<div class="row"><button class="btn" id="bk" type="button">Save a backup file</button><label class="btn ghost" for="ld" style="margin:0">Load a backup file</label></div>
    <input type="file" id="ld" accept="application/json,.json" hidden>`:'<p class="muted">Backup files work in the Home Screen version of the game.</p>'}
    <p id="pmsg" class="muted" hidden></p>
    <div class="row"><button class="btn ghost small" id="reset" type="button">Erase all progress</button><button class="btn sun small" id="hm" type="button">Done</button></div>
  </div>`;
  const msg=t=>{ const m=$('#pmsg'); m.hidden=false; m.textContent=t; };
  $('#hm').onclick=()=>go(home);
  if(canFiles){
    $('#bk').onclick=()=>{ try{ const blob=new Blob([JSON.stringify(store,null,1)],{type:'application/json'}); const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=`animal-game-backup-${dayKey()}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); msg('Backup file made. On iPad, choose where to save it in Files.'); }catch(e){ msg('Couldn\'t make the backup file on this device.'); } };
    $('#ld').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader();
      r.onload=()=>{ let o; try{ o=JSON.parse(r.result); }catch(err){ o=null; }
        const okFile=o&&o.v===2&&typeof o.writtenAt==='number'&&o.writtenAt>0&&Array.isArray(o.learned)&&o.found&&typeof o.found==='object'&&o.badges&&typeof o.badges==='object';
        if(!okFile){ msg('That file isn\'t an Animal Game backup. Nothing was changed.'); e.target.value=''; return; }
        const m=$('#pmsg'); m.hidden=false;
        m.innerHTML=`This backup from ${esc(new Date(o.writtenAt).toLocaleDateString('en-US'))} has ${Object.keys(o.found).length} stickers, ${Object.keys(o.badges).length} badges and ${o.learned.length} learned animals. Loading it replaces what's on this device. <button class="btn small" id="ldok" type="button" style="margin-top:8px">Replace with this backup</button>`;
        $('#ldok').onclick=()=>{ store=normalize(o); save(); rebuild(); setToggles(); grownUps(); const mm=$('#pmsg'); mm.hidden=false; mm.textContent='Backup loaded. Welcome back!'; };
        e.target.value=''; };
      r.readAsText(f); };
  }
  $('#reset').onclick=e=>{ const b=e.currentTarget; if(!b.dataset.sure){ b.dataset.sure='1'; b.textContent='Tap again to erase everything'; return; }
    const keep={voice:store.voice,sound:store.sound}; store=normalize(keep); save(); rebuild(); grownUps(); const m=$('#pmsg'); m.hidden=false; m.textContent='All progress erased.'; };
}

// ================= Boot =================
home();
idbGet().then(o=>{ if(o&&(o.writtenAt||0)>(store.writtenAt||0)){ store=normalize(o); rebuild(); setToggles(); try{ localStorage.setItem(LSKEY,JSON.stringify(store)); }catch(e){} if(document.querySelector('#mA')) home(); } else if(!o) save(); });
if('serviceWorker' in navigator && (location.protocol==='https:'&&/github\.io$/.test(location.hostname) || location.hostname==='localhost')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
})();
</script>
